[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-ec-apify-mcp"
version = "0.2.1"
description = "x402-enabled MCP server wrapping Apify actors for Japanese e-commerce search. Apify Store: https://apify.com/fruitful_quintessence/acts/whSePszWpMtfeLYBp"
requires-python = ">=3.12"
dependencies = [
    "fastmcp",
    "eth-account",
    "eth-utils",
]

[project.scripts]
japan-ec-apify-mcp = "scripts.mcp_x402_server:main"
